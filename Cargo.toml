[package]
name = "ocpp-client-simu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.33"
ocpp_rs = "0.4.1"
serde = { version = "^1", features = ["derive", "alloc"], default-features = false }
serde_json = "^1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
